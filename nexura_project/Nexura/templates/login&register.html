{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center" style="min-height: 80vh; background: #0a0a0a;">
    <div class="auth-card p-5 text-center" style="max-width: 450px; width: 100%; border: 1px solid #D4AF37;">
        <h2 class="serif text-gold mb-4" style="letter-spacing: 4px;">NEXURA</h2>
        <p class="text-white-50 mb-5 small text-uppercase">Accès Membre Privilégié</p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="custom-form-fields text-start text-white">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-nexura w-100 mt-4 py-3">
                Valider
            </button>
        </form>

        <div class="mt-4">
            {% if request.resolver_match.url_name == 'login' %}
                <a href="{% url 'register' %}" class="text-white-50 small">Pas encore membre ? Créer un compte</a>
            {% else %}
                <a href="{% url 'login' %}" class="text-white-50 small">Déjà inscrit ? Se connecter</a>
            {% endif %}
        </div>
    </div>
</div>

<style>
    .text-gold { color: #D4AF37; }
    .custom-form-fields input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid #333;
        color: white;
        padding: 10px 0;
        margin-bottom: 20px;
    }
    .custom-form-fields input:focus {
        outline: none;
        border-bottom: 1px solid #D4AF37;
    }
    .custom-form-fields label {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #888;
    }
</style>
{% endblock %}
